<h2>Géneros</h2>

<div class="card mb-4">
  <div class="card-body">
    <form (ngSubmit)="crear()" class="row g-2 align-items-end">
      <div class="col-12 col-sm-8 col-md-5">
        <label class="form-label" for="nuevoGenero">Nuevo género <span class="text-danger">*</span></label>
        <input
          id="nuevoGenero"
          name="nombre"
          class="form-control"
          [(ngModel)]="nuevoNombre"
          placeholder="Ej.: Jazz"
          required
        />
        <div *ngIf="!nuevoNombre && submitted" class="form-text text-danger">El nombre es requerido</div>
      </div>

      <div class="col-12 col-sm-auto">
        <button type="submit" class="btn btn-primary" [disabled]="cargando">
          {{ cargando ? 'Guardando…' : 'Agregar' }}
          <span *ngIf="cargando" class="spinnerspinner-border spinner-border-sm align-middle me-2" role="status" aria-hidden="true"></span>
        </button>
      </div>
    </form>
  </div>
</div>

<!-- Panel -->
<div class="d-flex justify-content-end mb-3">
  <span class="badge text-bg-secondary">Total: {{ generos.length }}</span>
</div>

<div class="table-responsive">
  <table class="table table-striped table-hover align-middle">
    <thead class="table-dark">
      <tr>
        <th scope="col">ID</th>
        <th scope="col">Nombre</th>
        <th scope="col" class="text-end">Acciones</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let genero of generos">
        <ng-container *ngIf="editandoId !== genero.id; else modoEdicion">
          <td class="text-muted">{{ genero.id }}</td>
          <td>{{ genero.nombre }}</td>
          <td class="text-end text-nowrap">
            <button class="btn btn-sm btn-outline-primary me-1" (click)="empezarEdicion(genero)">
              Editar
            </button>
            <button class="btn btn-sm btn-outline-danger" (click)="eliminar(genero)">
              Borrar
            </button>
          </td>
        </ng-container>

        <ng-template #modoEdicion>
          <td class="text-muted">{{ genero.id }}</td>
          <td>
            <input
              class="form-control form-control-sm"
              [(ngModel)]="nombreEditado"
              [name]="'nombre-' + genero.id"
              required
            />
          </td>
          <td class="text-end text-nowrap">
            <button class="btn btn-success btn-sm me-1" (click)="guardarEdicion(genero)">
              Guardar
            </button>
            <button class="btn btn-outline-secondary btn-sm" (click)="cancelarEdicion()">
              Cancelar
            </button>
          </td>
        </ng-template>
      </tr>

      <tr *ngIf="generos.length === 0">
        <td colspan="3" class="text-center text-muted py-4">No hay géneros para mostrar.</td>
      </tr>
    </tbody>
  </table>
</div>
