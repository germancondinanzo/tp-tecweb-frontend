<h2>Géneros</h2>

<form (ngSubmit)="crear()">
  <input
    name="nombre"
    [(ngModel)]="nuevoNombre"
    placeholder="Nuevo género"
  />
  <button type="submit">Agregar</button>
</form>

<p>Total: {{ generos.length }}</p>

<ul>
  <li *ngFor="let genero of generos">
    {{ genero.id }} — {{ genero.nombre }}
  </li>
</ul>
