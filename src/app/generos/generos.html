<h2>Géneros</h2>

<form (ngSubmit)="crear()">
  <input
    name="nombre"
    [(ngModel)]="nuevoNombre"
    placeholder="Nuevo género"
  />
  <button type="submit">Agregar</button>
</form>

<p>Total: {{ generos.length }}</p>

<ul>
  <li *ngFor="let genero of generos">
    <ng-container *ngIf="editandoId !== genero.id; else modoEdicion">
      {{ genero.id }} — {{ genero.nombre }}
      <button (click)="empezarEdicion(genero)">Editar</button>
      <button (click)="eliminar(genero)">Borrar</button>
    </ng-container>

    <ng-template #modoEdicion>
      <input [(ngModel)]="nombreEditado" [name]="'nombre-' + genero.id" />
      <button (click)="guardarEdicion(genero)">Guardar</button>
      <button (click)="cancelarEdicion()">Cancelar</button>
    </ng-template>
  </li>
</ul>
